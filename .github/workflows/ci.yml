name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # `npm ci` also runs `prepare`, which builds dist/
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Smoke test without a Figma token
        shell: bash
        run: |
          cli="$GITHUB_WORKSPACE/dist/cli/index.js"
          dir="$(mktemp -d)"
          cd "$dir"
          node "$cli" init
          node "$cli" demo
          node "$cli" check
